<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <title>Diagnóstico da Rotina Pedagógica - Biblioteca do Professor</title>
  <meta name="description" content="Descubra em 1 minuto o seu nível de sobrecarga na preparação de aulas e como ter atividades prontas e editáveis do 6º ao 9º ano.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* Embed do CSS base estilizado e otimizado */


@font-face { font-family: "Poppins"; font-weight: 500; font-display: swap; src: url("https://ar-no-preco-certo.vercel.app/fonts/poppins-500.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 600; font-display: swap; src: url("https://ar-no-preco-certo.vercel.app/fonts/poppins-600.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 700; font-display: swap; src: url("https://ar-no-preco-certo.vercel.app/fonts/poppins-700.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 800; font-display: swap; src: url("https://ar-no-preco-certo.vercel.app/fonts/poppins-800.woff2") format("woff2"); }

:root {
  --bg: #eef4ff;
  --card: #ffffff;
  --ink: #0b1b3a;
  --muted: #56688a;
  --line: #dbe5f6;
  --blue: #02358f;
  --blue-dk: #01266a;
  --blue-50: #e4ebf7;
  --sky: #01c6ce;
  --sky-50: #dcf7f8;
  --green: #16a34a;
  --green-50: #dcfce7;
  --cta: #22c55e;
  --cta-dk: #0f8a3c;
  --orange: #f59e0b;
  --orange-50: #fff3d6;
  --purple: #7c3aed;
  --purple-50: #efe8ff;
  --red: #ef4444;
  --red-50: #feeaea;
  --shadow: 0 10px 30px -12px rgba(2, 53, 143, .28), 0 2px 6px rgba(11, 27, 58, .06);
  --r: 20px;
}


.c-blue   { --c: var(--blue);   --c50: var(--blue-50); --c2: #01c6ce; }
.c-sky    { --c: var(--sky);    --c50: var(--sky-50); }
.c-green  { --c: var(--green);  --c50: var(--green-50); --c2: #4ade80; }
.c-orange { --c: var(--orange); --c50: var(--orange-50); }
.c-purple { --c: var(--purple); --c50: var(--purple-50); --c2: #c084fc; }
.c-red    { --c: var(--red);    --c50: var(--red-50); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body {
  font-family: "Poppins", system-ui, -apple-system, sans-serif;
  font-weight: 500;
  color: var(--ink);
  background:
    radial-gradient(120% 60% at 50% -10%, #d5e6f5 0%, rgba(214, 229, 255, 0) 60%),
    var(--bg);
  min-height: 100vh;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
img { display: block; max-width: 100%; height: auto; }
b, strong { font-weight: 700; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }


.app { max-width: 480px; margin: 0 auto; padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }


.reveal { animation: up .55s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }


h1, h2, h3 { font-weight: 800; letter-spacing: -.02em; line-height: 1.16; }
.hl { color: var(--blue); background: linear-gradient(transparent 62%, #bfeef1 62%); padding: 0 .08em; }
.warn { color: var(--red); background: linear-gradient(transparent 62%, #ffd5d5 62%); padding: 0 .08em; }


.btn {
  display: block; width: 100%; text-align: center; text-decoration: none;
  margin-top: 22px; padding: 18px 16px;
  border-radius: 18px;
  background: linear-gradient(180deg, #2fd56c, var(--green));
  color: #fff; font-weight: 800; font-size: 17px; letter-spacing: .02em; text-transform: uppercase;
  box-shadow: 0 6px 0 var(--cta-dk), 0 14px 28px -8px rgba(22, 163, 74, .55);
  transition: transform .12s, box-shadow .12s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--cta-dk), 0 8px 18px -8px rgba(22, 163, 74, .55); }
.btn--pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@media (prefers-reduced-motion: reduce) { .btn--pulse { animation: none; } }


.cover { text-align: center; padding-top: 20px; }
.cover h1 { font-size: 27px; text-wrap: balance; }
.cover .lede { text-wrap: balance; }
.cover .lede .u { white-space: nowrap; }
.lede { margin: 14px auto 18px; font-size: 15.5px; color: var(--muted); max-width: 400px; }
.lede strong { color: var(--ink); }
.lede .u { text-decoration: underline; text-decoration-color: var(--blue); text-decoration-thickness: 3px; text-underline-offset: 3px; }


.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 4px; }
.ba__item { position: relative; border-radius: 18px; overflow: hidden; border: 3px solid; background: #fff; box-shadow: var(--shadow); }
.ba__item img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
.ba__item--before { border-color: var(--red); }
.ba__item--after { border-color: var(--green); }
.ba__item figcaption {
  position: absolute; top: 8px; left: 8px;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff;
  padding: 3px 9px; border-radius: 99px;
}
.ba__item--before figcaption { background: var(--red); }
.ba__item--after figcaption { background: var(--green); }
.ba__card {
  position: absolute; left: 7px; right: 7px; bottom: 7px;
  display: flex; align-items: center; gap: 7px; text-align: left;
  background: rgba(255, 255, 255, .96); border-radius: 12px; padding: 6px 8px;
  box-shadow: 0 6px 16px -6px rgba(11, 27, 58, .35);
  animation: pop .5s .8s cubic-bezier(.2, 1.4, .4, 1) both;
}
.ba__mic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-size: 14px; flex: none; }
.ba__card small { display: block; font-size: 9.5px; color: var(--muted); line-height: 1.1; }
.ba__card b { display: block; font-size: 14px; color: var(--green); line-height: 1.15; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.9); } }



.q__top { display: flex; align-items: center; min-height: 24px; margin-bottom: 34px; }
.q__back {
  width: 40px; height: 40px; margin: -8px 0 -8px -12px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: transparent; border: 0; color: #8a98b3; opacity: .85;
}
.q__back:active { background: rgba(2, 53, 143, .06); }
.q__back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.q__progress { flex: 1; height: 10px; border-radius: 99px; background: #dbe5f6; overflow: hidden; }
.q__progress span {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--blue), var(--sky));
  transition: width .5s cubic-bezier(.2, .8, .2, 1);
}
.q__title { font-size: 23px; text-align: center; margin-bottom: 30px; }
.q__sub { text-align: center; color: var(--muted); margin: -8px 0 18px; }

.q__options { list-style: none; display: grid; gap: 11px; }
.opt {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 13px 14px;
  box-shadow: 0 3px 0 #d3def2;
  transition: border-color .15s, background .15s, transform .12s;
}
.opt:active { transform: scale(.985); }
.opt__emoji {
  width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none;
  background: var(--c50); font-size: 21px;
}
.opt__text { flex: 1; font-size: 15.5px; line-height: 1.3; }
.opt__text b { font-weight: 600; }
.opt__check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c6d3ea; flex: none; position: relative; }
.opt.is-picked { border-color: var(--c); background: var(--c50); box-shadow: 0 3px 0 var(--c); }
.opt.is-picked .opt__check { border-color: var(--c); background: var(--c); }
.opt.is-picked .opt__check::after {
  content: ""; position: absolute; left: 6px; top: 2.5px; width: 5px; height: 10px;
  border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
}
@media (hover: hover) { .opt:hover { border-color: var(--c); } }


.info .q__title { margin-bottom: 24px; }
[data-checks], [data-punch] { opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .5s cubic-bezier(.2, .8, .2, 1); }
[data-checks].is-in, [data-punch].is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { [data-checks], [data-punch] { opacity: 1; transform: none; } }

.checks, .finds {
  background: #fff; border-radius: var(--r); padding: 16px; margin-top: 16px; box-shadow: var(--shadow);
}
.checks__title { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }
.checks ul { list-style: none; display: grid; gap: 12px; }
.checks li { display: flex; gap: 12px; align-items: flex-start; }
.checks li b { display: block; font-size: 15px; line-height: 1.3; }
.checks li small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.checks--tight ul { gap: 9px; }
.ok {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--green); box-shadow: 0 4px 10px -4px rgba(22, 163, 74, .7);
}
.ok svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.ok--bad { background: var(--red); box-shadow: 0 4px 10px -4px rgba(239, 68, 68, .7); }
.is-in .ok svg { animation: draw .45s ease-out forwards; }
.is-in li:nth-child(2) .ok svg { animation-delay: .12s; }
.is-in li:nth-child(3) .ok svg { animation-delay: .24s; }
.is-in li:nth-child(4) .ok svg { animation-delay: .36s; }
.is-in li:nth-child(5) .ok svg { animation-delay: .48s; }
.is-in li:nth-child(6) .ok svg { animation-delay: .6s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .ok svg { stroke-dashoffset: 0; } }

.punch { text-align: center; font-size: 22px; font-weight: 800; line-height: 1.25; margin: 22px 0 4px; letter-spacing: -.02em; }
.punch__hl {
  display: inline-block; margin-top: 6px; color: #fff; background: var(--blue);
  padding: 2px 12px; border-radius: 10px; transform: rotate(-1.5deg);
  box-shadow: 0 6px 16px -6px rgba(2, 53, 143, .7);
}
.punch--static { margin-top: 18px; }

.note { border-radius: 16px; padding: 14px 16px; margin-top: 16px; border-left: 5px solid; }
.note b { display: block; font-size: 15.5px; margin-bottom: 3px; }
.note p { font-size: 14.5px; color: #33456a; }
.note--alert { background: var(--red-50); border-color: var(--red); }
.note--alert b { color: var(--red); }
.note--good { background: var(--green-50); border-color: var(--green); }
.note--good b { color: var(--green); }

.photo { margin-top: 16px; border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); border: 4px solid #fff; }
.photo img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; } 

.proofs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; align-items: start; }
.proofs__item { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.proofs__item figcaption { font-size: 12.5px; font-weight: 700; padding: 7px 10px; }


.shot-wrap { padding: 8px 0 6px; background: radial-gradient(50% 50% at 50% 50%, #bfeef1 0%, rgba(207, 224, 255, 0) 70%); }
.shot {
  position: relative; width: min(300px, 84%, max(150px, calc((100vh - 252px) * .439))); width: min(300px, 84%, max(150px, calc((100svh - 252px) * .439))); margin: 0 auto; aspect-ratio: 390 / 888;
  border: 9px solid #0b1b3a; border-radius: 38px; background: #f4f7ff; overflow: hidden;
  container-type: inline-size; box-shadow: 0 30px 50px -24px rgba(11, 27, 58, .55);
}
.shot::before { content: ""; position: absolute; z-index: 5; top: 5px; left: 50%; width: 28%; height: 13px; transform: translateX(-50%); background: #0b1b3a; border-radius: 99px; }
.shot--sm { grid-column: 1 / -1; width: min(270px, 84%, max(190px, calc((100vh - 140px) * .439))); width: min(270px, 84%, max(190px, calc((100svh - 140px) * .439))); margin: 16px auto 0; }
.demo { position: absolute; inset: 0; }

.demo__app { position: absolute; top: 0; left: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; pointer-events: none; background: #f4f7ff; }


.how { display: grid; gap: 14px; }
.how__step { display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; background: #fff; border-radius: var(--r); padding: 16px 14px; box-shadow: var(--shadow); border-top: 5px solid var(--c); }
.how__n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--c); color: #fff; font-weight: 800; box-shadow: 0 6px 14px -6px var(--c); }
.how__body { flex: 1; min-width: 0; }
.how__eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.how__body h3 { font-size: 19px; margin: 2px 0 4px; }
.how__body p { font-size: 14px; color: var(--muted); }


.diag { text-align: center; padding-top: 8px; }
.ring { position: relative; width: 132px; height: 132px; margin: 6px auto 16px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke: #dbe5f6; stroke-width: 10; }
.ring .ring__bar { stroke: url(#g) var(--blue); stroke: var(--blue); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--p)); }
.ring__n { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: var(--blue); }
.diag__steps { list-style: none; display: grid; gap: 9px; text-align: left; margin-top: 4px; }
.diag__steps li {
  display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 11px 12px;
  opacity: .45; transition: opacity .3s, border-color .3s;
}
.diag__steps li.is-active { opacity: 1; border-color: var(--blue); }
.diag__steps li.is-done { opacity: 1; }
.diag__steps b { display: block; font-size: 14.5px; line-height: 1.3; }
.diag__steps small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.diag__ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; background: var(--blue-50); }
.diag__ic .spin { width: 16px; height: 16px; border-color: #bcd1fb; border-top-color: var(--blue); display: none; }
.diag__ic svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; display: none; }
li.is-active .diag__ic .spin { display: block; }
li.is-done .diag__ic { background: var(--green); }
li.is-done .diag__ic svg { display: block; }
li.is-done .diag__ic .spin { display: none; }

.diag__res { opacity: 0; transform: translateY(14px); transition: opacity .5s, transform .5s; }
.diag__res.is-in { opacity: 1; transform: none; }
.diag__tag {
  display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: var(--blue); background: #fff; border: 1.5px solid #bfeef1; padding: 5px 12px; border-radius: 99px; margin-bottom: 10px;
}
.risk { background: #fff; border-radius: var(--r); padding: 16px; text-align: left; box-shadow: var(--shadow); }
.risk__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 14.5px; }
.risk__lvl { color: #fff; font-size: 13px; font-weight: 800; text-transform: uppercase; padding: 4px 12px; border-radius: 10px; }
.risk__lvl--alto { background: var(--red); }
.risk__lvl--médio { background: var(--orange); }
.risk__lvl--moderado { background: #eab308; }
.risk__bar { height: 14px; border-radius: 99px; background: #edf1f8; margin: 12px 0 8px; overflow: hidden; }
.risk__bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--green), #eab308 50%, var(--red)); background-size: calc(100% / (var(--w) / 100%)) 100%; }
.is-in .risk__bar i { animation: fill 1.1s .3s cubic-bezier(.2, .8, .2, 1) forwards; }
@keyframes fill { to { width: var(--w); } }
.risk__time { font-size: 13.5px; color: var(--muted); font-weight: 600; }
.finds { text-align: left; }
.finds ul { list-style: none; display: grid; gap: 10px; }
.finds li { display: flex; gap: 10px; font-size: 14.5px; line-height: 1.4; }
.finds__ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--orange-50); color: var(--orange); font-size: 16px; }
.diag .note { text-align: left; }


.offer__stack em { font-style: normal; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--green); background: var(--green-50); padding: 3px 8px; border-radius: 99px; }

.offer { position: relative; margin-top: 26px; text-align: center; background: #fff; border-radius: 24px; padding: 26px 18px 20px; border: 3px solid var(--blue); box-shadow: 0 24px 48px -20px rgba(2, 53, 143, .55); scroll-margin-top: 30px; }
.offer__off { position: absolute; top: -14px; right: 14px; background: var(--red); color: #fff; font-weight: 800; font-size: 15px; padding: 5px 12px; border-radius: 12px; transform: rotate(4deg); box-shadow: 0 6px 14px -6px rgba(239, 68, 68, .8); }
.offer__k { font-size: 15px; font-weight: 700; color: var(--muted); }
.offer__k s { text-decoration-color: var(--red); text-decoration-thickness: 2.5px; }
.offer__price { font-size: clamp(46px, 15vw, 58px); font-weight: 800; color: var(--blue); line-height: 1.05; letter-spacing: -.04em; margin: 4px 0; }
.offer__once { font-size: 13px; color: var(--muted); font-weight: 600; }
.offer__stack { list-style: none; display: grid; gap: 7px; margin: 16px 0 12px; text-align: left; }
.offer__stack li { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg); border-radius: 12px; padding: 9px 12px; font-size: 14px; font-weight: 700; }
.offer__sum { font-size: 15px; font-weight: 600; }
.offer__sum b { color: var(--green); }
.offer .btn { margin-top: 14px; }
.offer__safe { font-size: 12.5px; color: var(--muted); margin-top: 12px; font-weight: 600; }


body.pv-body { background: #fff; }
body.pv-body .app { padding-top: 0; padding-bottom: 0; }
.pv {
  --raio: 20px;
  --sombra: 0 1px 2px rgba(2, 53, 143, .06), 0 8px 24px rgba(2, 53, 143, .08);
  --borda: 1px solid rgba(2, 53, 143, .09);
  --ciano-txt: #00838a;  
  --escuro: #01245f;
  --amb: #ffd34d;
  --verde-txt: #15803d;
  --verm-txt: #b91c1c;
}
.pv p { text-wrap: pretty; }


.sec { position: relative; margin-inline: -16px; padding: 40px 20px; display: flex; flex-direction: column; gap: 20px; text-align: center; }
.sec + .sec { box-shadow: 0 -12px 24px -12px rgba(2, 53, 143, .2); }
.sec + .sec--escuro, .sec--escuro + .sec { box-shadow: 0 -14px 28px -10px rgba(1, 20, 60, .45); }
.sec > * { margin: 0; }
.sec:first-child { padding-top: max(8px, env(safe-area-inset-top)); }
.sec:last-child { padding-bottom: calc(48px + env(safe-area-inset-bottom)); }
.sec--claro { background: linear-gradient(180deg, #e4f7fa 0%, #f5fcfd 55%, #fff 100%); }
.sec--branco { background: #fff; }
.sec--escuro { background: linear-gradient(180deg, #02358f 0%, var(--escuro) 100%); color: #fff; }
.sec--sem { background: linear-gradient(180deg, #fff5f8 0%, #fde6ee 100%); }  

.sec--dor { background: linear-gradient(180deg, #fff6f2 0%, #ffe3da 100%); }
.sec--com { background: linear-gradient(180deg, #f1fdf5 0%, #dbf7e5 100%); }


.tit { font-size: clamp(22px, 6.4vw, 26px); line-height: 1.2; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.apoio { font-size: 17px; line-height: 1.35; font-weight: 600; color: #4a5d80; text-wrap: balance; }
.sec--escuro .apoio { color: #b8cdf2; }
.apoio + .tit { margin-top: -12px; }

.sec > .lista + .tit, .sec > .lista + .apoio, .sec > .card + .tit { margin-top: 24px; }
.sec > .rot + .lista { margin-top: -10px; }

.sec > .lista--solta, .sec > .rot--solta { padding-inline: 12px; }

      // 10: TELA DE ANÁLISE / DIAGNÓSTICO
      {
        id: "diagnostico",

          const riscoInfo = RISCO_NIVEIS[tempoGasto] || { nivel: "ALTO", pct: 82, cor: "alto" };

          const achados = [

            <section class="q diag">

                <div class="finds">
                  <p class="checks__title">O que identificamos nas suas respostas:</p>
                  <ul role="list">

                      <li>
                        <span class="finds__ic">
                          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 4 2.5 20h19z"/><path d="M12 10v4m0 3h.01"/>

      // 11: OFERTA / TRANSIÇÃO FINAL COM LINK DIRETO PARA LANDING OU CHECKOUT
      {
        id: "oferta",

          <section class="pv">

                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#334155" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>

              <h1 class="pv__h1" style="font-size:22px; line-height:1.25; margin-bottom:12px;">

              <p style="font-size:13.5px; color:#475569; margin-bottom:18px;">

                <span style="background:#eff6ff; color:#2563eb; font-weight:700; font-size:12px; padding:4px 12px; border-radius:20px; display:inline-block; margin-bottom:10px;">

                </span>
                
                <div style="text-decoration:line-through; color:#94a3b8; font-size:14px; font-weight:600;">

                </div>
                <div style="font-size:36px; font-weight:900; color:#16a34a; margin:4px 0 10px;">
                  R$ 47,00
                </div>
                <div style="font-size:12px; color:#64748b; margin-bottom:16px;">
                  Pagamento único · Acesso vitalício · Sem mensalidades
                </div>

                <div class="checks" style="text-align:left; margin-bottom:18px;">
                  <ul role="list" style="display:flex; flex-direction:column; gap:8px;">
                    <li style="display:flex; align-items:center; gap:8px; font-size:12.5px;">
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#16a34a" stroke-width="3"><path d="m6 12.5 4 4 8-9"/></svg>
                      <span><strong>4 Bimestres Completos</strong> do 6º ao 9º ano</span>
                    </li>
                    <li style="display:flex; align-items:center; gap:8px; font-size:12.5px;">
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#16a34a" stroke-width="3"><path d="m6 12.5 4 4 8-9"/></svg>
                      <span><strong>Arquivos Word editáveis</strong> e PDFs prontos</span>
                    </li>
                    <li style="display:flex; align-items:center; gap:8px; font-size:12.5px;">

                  🔒 7 dias de garantia incondicional
                </p>
              </div>

              <!-- Atalho para ver a Landing Page com todos os detalhes -->
              <div style="text-align:center; margin-top:12px;">
                <a href="${CONFIG.landingUrl}" style="color:#2563eb; font-weight:600; font-size:13px; text-decoration:underline;">
                  Prefere ver todos os detalhes na página oficial do produto? Clique aqui
                </a>
              </div>
            </div>
          </section>
        `
      }
    ];

    // Gerenciamento de Estado do Quiz
    const Quiz = {
      currentStep: 0,
      answers: {},

      init() {
        this.renderStep();
      },

      renderStep() {
        const container = document.getElementById("quiz-app");
        const step = STEPS[this.currentStep];

        if (step.type === "cover" || step.type === "info" || step.type === "offer") {
          container.innerHTML = step.render(this);
        } else if (step.type === "question") {
          container.innerHTML = this.renderQuestion(step);
        } else if (step.type === "diagnosis") {
          container.innerHTML = step.render(this);
          this.runDiagnosisAnimation();
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
      },

      renderQuestion(step) {
        const pct = (step.number / CONFIG.totalQuestoes) * 100;
        const cores = ["c-blue", "c-sky", "c-green", "c-orange", "c-purple"];

        return `
          <section class="q">
            <header class="q__top">
              <div class="q__progress" role="progressbar" aria-valuenow="${step.number}">
                <span style="width: ${pct}%;"></span>
              </div>
            </header>
            
            <h2 class="q__title reveal">${step.title}</h2>
            
            <ul class="q__options" role="list">
              ${step.options.map((opt, idx) => `
                <li class="reveal" style="animation-delay: ${0.05 + idx * 0.05}s">
                  <button class="opt ${cores[idx % cores.length]}" type="button" onclick="Quiz.selectOption('${step.id}', '${opt.label.replace(/'/g, "\'")}', this)">
                    <span class="opt__emoji" aria-hidden="true">${opt.emoji}</span>
                    <span class="opt__text"><b>${opt.label}</b></span>
                    <span class="opt__check" aria-hidden="true"></span>
                  </button>
                </li>
              `).join("")}
            </ul>
          </section>
        `;
      },

      selectOption(questionId, value, buttonEl) {
        this.answers[questionId] = value;
        
        // Destaca o botão selecionado
        const allBtns = buttonEl.closest(".q__options").querySelectorAll(".opt");
        allBtns.forEach(b => b.classList.remove("is-picked"));
        buttonEl.classList.add("is-picked");

        // Pequeno delay natural para avançar
        setTimeout(() => {
          this.next();
        }, 320);
      },

      next() {
        if (this.currentStep < STEPS.length - 1) {
          this.currentStep++;
          this.renderStep();
        }
      },

      restart() {
        this.currentStep = 0;
        this.answers = {};
        this.renderStep();
      },

      runDiagnosisAnimation() {
        const ring = document.getElementById("diag-ring");
        const pctEl = document.getElementById("diag-pct");
        const items = [...document.querySelectorAll("#diag-step-list li")];
        const runBox = document.getElementById("diag-run");
        const resBox = document.getElementById("diag-res");

        const TOTAL_DURATION = 4200; // 4.2 segundos
        const stepTime = TOTAL_DURATION / items.length;
        let start = null;

        const animate = (timestamp) => {
          if (!start) start = timestamp;
          const elapsed = timestamp - start;
          const progress = Math.min(1, elapsed / TOTAL_DURATION);
          const currentPct = Math.round(progress * 100);

          if (ring) ring.style.setProperty("--p", currentPct);
          if (pctEl) pctEl.textContent = currentPct + "%";

          const currentIdx = Math.min(items.length - 1, Math.floor(elapsed / stepTime));
          items.forEach((li, i) => {
            li.classList.toggle("is-done", i < currentIdx || progress === 1);
            li.classList.toggle("is-active", i === currentIdx && progress < 1);
          });

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            setTimeout(() => {
              if (runBox) runBox.hidden = true;
              if (resBox) {
                resBox.hidden = false;
                window.scrollTo({ top: 0, behavior: "smooth" });
              }
            }, 450);
          }
        };

        requestAnimationFrame(animate);
      }
    };

    // Inicia o Quiz assim que carregar
    document.addEventListener("DOMContentLoaded", () => {
      Quiz.init();
    });
