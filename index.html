  --orange: #f59e0b;

      let id = null, sx = 0, sy = 0;
      el.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse") return;
        id = e.pointerId;
        sx = e.clientX;
        sy = e.clientY;
      }, { passive: true });
      el.addEventListener("pointercancel", () => { id = null; });
      el.addEventListener("pointerup", (e) => {
        if (e.pointerType === "mouse" || e.pointerId !== id) return;
        id = null;
        if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) return;
        ultimoToque = Date.now();
        fn(e);
      });
      el.addEventListener("click", (e) => {
        if (Date.now() - ultimoToque < 700) {
          e.preventDefault();
          return;
        }
        fn(e);
      });
    }

      if (!("IntersectionObserver" in window)) {

      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add("is-in");
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0, rootMargin: "0px 0px -12% 0px" });
      nodes.forEach((n) => io.observe(n));
      return () => io.disconnect();

                  </div>
                </div>
              </article>
            </div>

            <a class="btn btn--pulse" href="${buildDestinoUrl(CONFIG.queroAppUrl)}">Quero o aplicativo</a>
          </section>`
      }
    ];

    const app = document.getElementById("app");
    let cleanup = null;

    function render() {
      if (cleanup) {
        cleanup();
        cleanup = null;
      }
      const step = STEPS[state.step];
      app.innerHTML = step.render({ state });
      app.dataset.step = step.id;
      window.scrollTo(0, 0);

      const nextBtn = app.querySelector("[data-next]");
      if (nextBtn) {
        onTap(nextBtn, () => next());
      }

      if (step.mount) {
        cleanup = step.mount(app, { state }) || null;
      }
    }

    function next(answer) {
      const step = STEPS[state.step];
      if (answer !== undefined) {
        state.answers[step.id] = answer;
      }
      if (state.step < STEPS.length - 1) {
        state.step++;
        render();
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", render);
    } else {
      render();
    }
  })();
  </script>
</body>
</html>
